{% extends "base.html" %}
{% block content %}
<article class="prose article">
  <header class="article-header">
    <p class="kicker">Органический книжный клуб</p>
    <h1>Ничегонеделание делает нас живыми</h1>
  </header>
  {{ page.content }}
</article>
<section class="reg">
  <h2 class="kicker">Регистрация</h2>
  <form class="reg-form" id="reg-form" method="post" action="{{ page.meta.form_url | e }}">
    <label>Имя <input type="text" name="name" required autocomplete="name"></label>
    <label>Номер телефона <input type="tel" name="phone" required autocomplete="tel"></label>
    <label>Эл. почта <input type="email" name="email" required autocomplete="email"></label>
    <fieldset>
      <legend>Формат участия</legend>
      <label class="radio"><input type="radio" name="format" value="Оффлайн, Кемерово, 28 сентября" required> Оффлайн, Кемерово, 28 сентября</label>
      <label class="radio"><input type="radio" name="format" value="Онлайн, Zoom, 29 сентября" required> Онлайн, Zoom, 29 сентября</label>
    </fieldset>
    <label class="trap" aria-hidden="true">Сайт <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <button type="submit">Зарегистрироваться</button>
    <p class="form-error" id="reg-error" hidden>Не удалось записать заявку. Напишите <a href="{{ site.telegram }}">@xenitch</a> или <a href="{{ page.meta.pay_url | e }}">перейдите к оплате</a>.</p>
  </form>
</section>
<script>
(function () {
  var form = document.getElementById('reg-form');
  var error = document.getElementById('reg-error');
  var payUrl = {{ page.meta.pay_url | tojson }};
  var formUrl = {{ page.meta.form_url | tojson }};
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var button = form.querySelector('button');
    var data = {};
    new FormData(form).forEach(function (v, k) { data[k] = v; });
    error.hidden = true;
    button.disabled = true;
    button.textContent = 'Отправляем…';
    if (!formUrl) { location.href = payUrl; return; }
    fetch(formUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || 'error');
        location.href = payUrl;
      })
      .catch(function () {
        error.hidden = false;
        button.disabled = false;
        button.textContent = 'Зарегистрироваться';
      });
  });
})();
</script>
{% endblock %}
